<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcadeVault</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="sidebar" aria-label="Site navigation">
    <div class="brand">
      <h1>Arcade<span>Vault</span></h1>
      <p>Games • Apps • Chat</p>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Games</div>
      <a class="nav-link active" data-page="index" data-group="games" href="index.html"><span class="icon">🏠</span> Dashboard</a>
      <a class="nav-link" data-page="games" data-group="games" href="games.html"><span class="icon">🎮</span> All Games <span class="count">18</span></a>
      <a class="nav-link" data-page="games" data-group="games" href="games.html?filter=featured"><span class="icon">⭐</span> Featured</a>
      <a class="nav-link" data-page="games" data-group="games" href="games.html?filter=new"><span class="icon">✨</span> New</a>
      <a class="nav-link" data-page="games" data-group="games" href="games.html?filter=hot"><span class="icon">🔥</span> Popular</a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Apps</div>
      <a class="nav-link" data-page="apps" href="apps.html"><span class="icon">🧰</span> Apps Home</a>
      <a class="nav-link" data-page="apps" href="apps.html#notes"><span class="icon">📝</span> Notes</a>
      <a class="nav-link" data-page="apps" href="apps.html#calculator"><span class="icon">🧮</span> Calculator</a>
      <a class="nav-link" data-page="apps" href="apps.html#timer"><span class="icon">⏱️</span> Timer</a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Chat</div>
      <a class="nav-link" data-page="chat" href="chat.html"><span class="icon">💬</span> Chat Home</a>
      <a class="nav-link" data-page="chat" href="chat.html#friends"><span class="icon">👥</span> Friends</a>
      <a class="nav-link" data-page="chat" href="chat.html#messages"><span class="icon">📨</span> Messages</a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Settings</div>
      <a class="nav-link" data-page="settings" href="settings.html"><span class="icon">⚙️</span> Settings</a>
      <a class="nav-link" data-page="settings" href="settings.html#theme"><span class="icon">🎨</span> Theme</a>
      <a class="nav-link" data-page="settings" href="settings.html#sound"><span class="icon">🔊</span> Sound</a>
      <a class="nav-link" data-page="settings" href="settings.html#account"><span class="icon">👤</span> Account</a>
    </div>

    <div class="sidebar-footer">ArcadeVault &copy; 2025</div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="topbar-tools">
        <input id="searchInput" class="search" type="search" placeholder="Search games..." oninput="filterGames()" />
      </div>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-head">
          <h2>Featured Games</h2>
        </div>
        <div class="grid" id="featuredGrid"></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h2>All Games</h2>
        </div>
        <div class="grid" id="allGrid"></div>
      </div>
    </div>
  </main>
</body>
</html>
