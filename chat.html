<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcadeVault - Chat</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="sidebar" aria-label="Site navigation">
    <div class="brand">
      <h1>Arcade<span>Vault</span></h1>
      <p>Games • Apps • Chat</p>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Games</div>
      <a class="nav-link" data-page="index" href="index.html"><span class="icon">🏠</span> Dashboard</a>
      <a class="nav-link" data-page="games" href="games.html"><span class="icon">🎮</span> All Games <span class="count">18</span></a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Apps</div>
      <a class="nav-link" data-page="apps" href="apps.html"><span class="icon">🧰</span> Apps Home</a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Chat</div>
      <a class="nav-link active" data-page="chat" href="chat.html"><span class="icon">💬</span> Chat Home</a>
      <a class="nav-link" href="#friends"><span class="icon">👥</span> Friends</a>
      <a class="nav-link" href="#messages"><span class="icon">📨</span> Messages</a>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Settings</div>
      <a class="nav-link" data-page="settings" href="settings.html"><span class="icon">⚙️</span> Settings</a>
    </div>

    <div class="sidebar-footer">ArcadeVault &copy; 2025</div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="page-title">Chat</div>
      <div class="topbar-tools">
        <button class="btn" onclick="clearChat()">Clear Chat</button>
      </div>
    </div>

    <div class="content">
      <div class="chat-box">
        <div class="messages" id="messagesList"></div>

        <div class="chat-compose" id="messages">
          <input id="chatInput" type="text" placeholder="Type a message..." />
          <button class="btn" onclick="sendChat()">Send</button>
        </div>
      </div>

      <div class="section" id="friends" style="margin-top:24px;">
        <div class="section-head"><h2>Friends</h2></div>
        <div class="pills">
          <span class="pill">Nova</span>
          <span class="pill">Kai</span>
          <span class="pill">Milo</span>
          <span class="pill">Sky</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
